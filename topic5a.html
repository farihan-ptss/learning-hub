          {/* Langkah 2: Buka Panel Sisi & Pembumian Statik */}

                </div>

                {!caseCompleted ? (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider px-2.5 py-1 rounded bg-indigo-950/60 border border-indigo-800">
                        {diagnosticScenarios[selectedCase].steps[scenarioStep].stage}
                      </span>
                      <span className="text-xs text-slate-400 font-mono">
                        Langkah {scenarioStep + 1} / 6
                      </span>
                    </div>

                    <h4 className="text-sm sm:text-base font-bold text-white">
                      {diagnosticScenarios[selectedCase].steps[scenarioStep].prompt}
                    </h4>

                    <div className="space-y-2.5">
                      {diagnosticScenarios[selectedCase].steps[scenarioStep].options.map((opt, oIdx) => (
                        <button
                          key={oIdx}
                          onClick={() => handleScenarioChoice(opt)}
                          className="w-full text-left p-3.5 rounded-xl bg-slate-950 hover:bg-slate-850 border border-slate-800 hover:border-amber-500/60 text-xs sm:text-sm text-slate-200 transition flex items-center justify-between group"
                        >
                          <span className="leading-relaxed pr-2">{opt.text}</span>
                          <ChevronRight className="w-4 h-4 text-slate-600 group-hover:text-amber-400 flex-shrink-0 transition" />
                        </button>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="p-6 rounded-xl bg-emerald-950/30 border border-emerald-800 text-center space-y-4">
                    <div className="w-14 h-14 bg-emerald-600/20 text-emerald-400 rounded-xl mx-auto flex items-center justify-center border border-emerald-500">
                      <CheckCircle2 className="w-8 h-8" />
                    </div>
                    <h4 className="text-xl font-bold text-white">Kes Selesai Berjaya!</h4>
                    <p className="text-xs text-slate-300 max-w-md mx-auto">
                      Anda telah mematuhi kesemua 6 langkah tatacara penyelesaian masalah secara profesional dan berintegriti.
                    </p>
                    <button
                      onClick={() => resetScenario(selectedCase)}
                      className="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition shadow-lg"
                    >
                      Ulangi Kes Ini
                    </button>
                  </div>
                )}
              </div>

              {/* Log Tiket Servis */}
              <div className="lg:col-span-5 bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                      <Terminal className="w-4 h-4 text-emerald-400" />
                      Log Tindakan Servis (Audit Trail)
                    </span>
                    <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">
                      Active Ticket
                    </span>
                  </div>

                  <div className="space-y-2.5 max-h-[380px] overflow-y-auto pr-1 scrollbar-thin scrollbar-thumb-slate-800">
                    {scenarioLog.length === 0 ? (
                      <div className="text-center py-12 text-slate-600 text-xs italic">
                        Belum ada tindakan diambil. Pilih keputusan diagnosis pada panel sebelah kiri.
                      </div>
                    ) : (
                      scenarioLog.map((log, lIdx) => (
                        <div
                          key={lIdx}
                          className={`p-3 rounded-lg border text-xs ${
                            log.isCorrect
                              ? 'bg-slate-900 border-emerald-900/60 text-slate-300'
                              : 'bg-rose-950/20 border-rose-900/60 text-rose-300'
                          }`}
                        >
                          <div className="flex items-center justify-between font-bold text-[11px] mb-1">
                            <span className={log.isCorrect ? 'text-emerald-400' : 'text-rose-400'}>
                              {log.stage}
                            </span>
                            <span>{log.isCorrect ? '✓ Disahkan' : '✗ Ralat'}</span>
                          </div>
                          <p className="text-slate-400 text-[11px] mb-1">"{log.selected}"</p>
                          <p className={`text-[10px] font-medium ${log.isCorrect ? 'text-emerald-300' : 'text-rose-300'}`}>
                            {log.feedback}
                          </p>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-800 mt-3 text-[11px] text-slate-500 flex items-center justify-between">
                  <span>Status: {caseCompleted ? 'Tiket Ditutup (Closed)' : 'Sedang Dibaiki (In Progress)'}</span>
                  <span className="font-mono">ITIL Standard v4</span>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ========================================================================= */}
        {/* TAB: KUIZ INTERAKTIF */}
        {/* ========================================================================= */}
        {activeTab === 'quiz' && (
          <div className="space-y-6 animate-fadeIn">
            <div className="bg-gradient-to-r from-slate-900 via-purple-950/50 to-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
              <div className="flex flex-wrap items-center gap-2 mb-2">
                <span className="px-2.5 py-1 rounded-md text-xs font-semibold bg-purple-500/20 text-purple-300 border border-purple-500/30">
                  Ujian Penilaian Formatif
                </span>
                <span className="text-xs text-slate-400">10 Soalan Standard Silibus 5.1, 5.2 & 5.3</span>
              </div>
              <h2 className="text-2xl sm:text-3xl font-bold text-white tracking-tight">
                Kuiz Pengukuhan Komprehensif
              </h2>
              <p className="mt-2 text-slate-300 text-sm sm:text-base max-w-4xl">
                Uji kefahaman teori, piawaian keselamatan, urutan perkakasan dan langkah penyelesaian masalah teknikal.
              </p>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl max-w-3xl mx-auto">
              {quizIndex < quizQuestions.length ? (
                <div className="space-y-6">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div className="flex items-center gap-2">
                      <span className="px-3 py-1 rounded-lg bg-purple-950 text-purple-300 text-xs font-bold border border-purple-800">
                        Soalan {quizIndex + 1} daripada {quizQuestions.length}
                      </span>
                    </div>
                  </div>

                  <h3 className="text-base sm:text-lg font-bold text-white leading-snug">
                    {quizQuestions[quizIndex].q}
                  </h3>

                  <div className="space-y-3">
                    {quizQuestions[quizIndex].options.map((opt, oIdx) => {
                      let btnStyle = "bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-850 hover:border-slate-700";

                      if (selectedAnswer === oIdx) {
                        btnStyle = "bg-purple-950/60 border-purple-500 text-white ring-1 ring-purple-500/50";
                      }

                      if (isAnswerSubmitted) {
                        if (oIdx === quizQuestions[quizIndex].answer) {
                          btnStyle = "bg-emerald-950/70 border-emerald-500 text-emerald-200 ring-1 ring-emerald-500";
                        } else if (selectedAnswer === oIdx && oIdx !== quizQuestions[quizIndex].answer) {
                          btnStyle = "bg-rose-950/70 border-rose-500 text-rose-200 ring-1 ring-rose-500";
                        }
                      }

                      return (
                        <button
                          key={oIdx}
                          onClick={() => handleQuizAnswer(oIdx)}
                          disabled={isAnswerSubmitted}
                          className={`w-full text-left p-4 rounded-xl border text-xs sm:text-sm font-medium transition flex items-center justify-between ${btnStyle}`}
                        >
                          <span className="pr-3 leading-relaxed">{opt}</span>
                          <div className={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-mono border flex-shrink-0 ${
                            selectedAnswer === oIdx ? 'border-purple-400 bg-purple-600 text-white' : 'border-slate-700 text-slate-500'
                          }`}>
                            {String.fromCharCode(65 + oIdx)}
                          </div>
                        </button>
                      );
                    })}
                  </div>

                  {isAnswerSubmitted && (
                    <div className={`p-4 rounded-xl border text-xs sm:text-sm leading-relaxed ${
                      selectedAnswer === quizQuestions[quizIndex].answer
                        ? 'bg-emerald-950/30 border-emerald-800 text-emerald-200'
                        : 'bg-rose-950/30 border-rose-800 text-rose-200'
                    }`}>
                      <strong className="block font-bold mb-1">
                        {selectedAnswer === quizQuestions[quizIndex].answer ? '✓ Jawapan Tepat!' : '✗ Kurang Tepat!'}
                      </strong>
                      {quizQuestions[quizIndex].explanation}
                    </div>
                  )}

                  <div className="pt-4 border-t border-slate-800 flex items-center justify-between">
                    <button
                      onClick={resetQuiz}
                      className="text-xs text-slate-400 hover:text-white flex items-center gap-1.5"
                    >
                      <RotateCcw className="w-3.5 h-3.5" />
                      <span>Mula Semula Kuiz</span>
                    </button>

                    {!isAnswerSubmitted ? (
                      <button
                        onClick={submitQuizAnswer}
                        disabled={selectedAnswer === null}
                        className="px-6 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold shadow-lg shadow-purple-600/20 transition disabled:opacity-40"
                      >
                        Sahkan Jawapan
                      </button>
                    ) : (
                      <button
                        onClick={nextQuizQuestion}
                        className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-bold shadow-lg transition flex items-center gap-2"
                      >
                        <span>{quizIndex + 1 === quizQuestions.length ? 'Lihat Keputusan Akhir' : 'Soalan Seterusnya'}</span>
                        <ArrowRight className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                </div>
              ) : (
                <div className="text-center py-8 space-y-5">
                  <div className="w-20 h-20 bg-gradient-to-tr from-purple-600 to-amber-500 text-white rounded-3xl mx-auto flex items-center justify-center shadow-xl shadow-purple-600/30">
                    <Award className="w-10 h-10" />
                  </div>
                  <div>
                    <h3 className="text-2xl font-bold text-white">Keputusan Kuiz Anda</h3>
                    <p className="text-sm text-slate-400 mt-1">Penilaian Modul Hardware, Software & Networking Troubleshooting</p>
                  </div>

                  <div className="inline-block p-6 rounded-2xl bg-slate-950 border border-slate-800 shadow-inner">
                    <span className="text-4xl font-extrabold text-white font-mono">
                      {quizScore} <span className="text-lg text-slate-500">/ {quizQuestions.length * 10}</span>
                    </span>
                    <span className="block text-xs font-semibold text-emerald-400 mt-2">
                      Gred: {quizScore >= 80 ? 'Cemerlang (A+)' : quizScore >= 60 ? 'Kepujian (B)' : 'Perlu Ulang Kaji (C)'}
                    </span>
                  </div>

                  <p className="text-xs text-slate-300 max-w-md mx-auto">
                    {quizScore >= 80
                      ? 'Tahniah! Anda telah menguasai sepenuhnya konsep komunikasi rangkaian, tatacara pemasangan perkakasan, dan metodologi 6-langkah penyelesaian masalah.'
                      : 'Teruskan usaha anda! Semak semula modul teori 5.1, 5.2, dan 5.3 untuk meningkatkan kefahaman teknikal anda.'}
                  </p>

                  <button
                    onClick={resetQuiz}
                    className="px-6 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold transition shadow-lg"
                  >
                    Ulangi Kuiz Semula
                  </button>
                </div>
              )}
            </div>
          </div>
        )}

        {/* ========================================================================= */}
        {/* TAB: GLOSARI & RUJUKAN PANTAS */}
        {/* ========================================================================= */}
        {activeTab === 'glossary' && (
          <div className="space-y-6 animate-fadeIn">
            <div className="bg-gradient-to-r from-slate-900 via-cyan-950/50 to-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
              <div className="flex flex-wrap items-center gap-2 mb-2">
                <span className="px-2.5 py-1 rounded-md text-xs font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                  Pusat Rujukan Pantas
                </span>
                <span className="text-xs text-slate-400">Glosari Istilah & Kod Ralat Teknikal</span>
              </div>
              <h2 className="text-2xl sm:text-3xl font-bold text-white tracking-tight">
                Glosari & Nota Poket Troubleshooting
              </h2>
              <p className="mt-2 text-slate-300 text-sm sm:text-base max-w-4xl">
                Carian pantas istilah teknikal, arahan diagnostik Terminal (Command Prompt), kod bip BIOS, dan pangkalan pengetahuan IT.
              </p>
            </div>

            {/* Kotak Carian */}
            <div className="relative max-w-xl">
              <Search className="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Cari istilah (cth: APIPA, ESD, Cat6, Thermal, POST, BSOD)..."
                className="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition"
              />
            </div>

            {/* Kad Glosari */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {filteredGlossary.map((item, idx) => (
                <div
                  key={idx}
                  className="p-4 rounded-xl bg-slate-900 border border-slate-800 hover:border-cyan-500/40 transition flex flex-col justify-between"
                >
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <h4 className="font-bold text-white text-sm sm:text-base">{item.term}</h4>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-950 text-cyan-400 border border-slate-800">
                        {item.cat}
                      </span>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">{item.desc}</p>
                  </div>
                </div>
              ))}
            </div>

            {/* Helaian Arahan CLI (Command Prompt) */}
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
              <h4 className="text-base font-bold text-white flex items-center gap-2">
                <Terminal className="w-5 h-5 text-emerald-400" />
                Arahan Diagnostik Rangkaian Penting (CLI Cheatsheet)
              </h4>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
                <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 font-mono">
                  <span className="text-emerald-400 font-bold block mb-1">ipconfig /all</span>
                  <span className="text-slate-400 font-sans text-[11px]">Memaparkan maklumat lengkap IP, Subnet Mask, Default Gateway, DHCP & MAC Address.</span>
                </div>

                <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 font-mono">
                  <span className="text-emerald-400 font-bold block mb-1">ping -t 8.8.8.8</span>
                  <span className="text-slate-400 font-sans text-[11px]">Menguji kesinambungan sambungan data (latency & packet loss) ke DNS Google secara berterusan.</span>
                </div>

                <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 font-mono">
                  <span className="text-emerald-400 font-bold block mb-1">tracert google.com</span>
                  <span className="text-slate-400 font-sans text-[11px]">Menjejak setiap lompatan router (hops) dari PC ke pelayan destinasi bagi mengesan bottleneck.</span>
                </div>

                <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 font-mono">
                  <span className="text-emerald-400 font-bold block mb-1">netstat -an</span>
                  <span className="text-slate-400 font-sans text-[11px]">Menyenaraikan semua port aktif dan sambungan TCP/UDP yang sedang dibuka oleh sistem.</span>
                </div>
              </div>
            </div>
          </div>
        )}
      </main>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
